
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - CMR Library Zone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(rgba(0,30,65,.75), rgba(0,30,65,.75)),
                        url("image.png") center/cover fixed;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,.3);
        }

        h2 {
            text-align: center;
            color: #123c69;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1769aa;
        }

        button:disabled {
            background: #888;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
            font-size: 14px;
        }

        a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Student Login</h2>
    <p class="subtitle">Welcome to CMR Library Zone</p>

    <form id="loginForm">

        <input type="email" id="email"
               placeholder="Email Address" required>

        <input type="password" id="password"
               placeholder="Password" required>

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <p id="message"></p>

    <div class="links">
        New student?
        <a href="studentregister.html">Create an account</a>
        <br>
        <a href="index.html">Back to Home</a>
    </div>

</div>

<script>
    const API_URL = "http://localhost:8080";

    document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        const loginData = {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
        };

        button.disabled = true;
        button.textContent = "Logging in...";
        message.textContent = "";

        try {
            const response = await fetch(API_URL + "/api/users/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(loginData)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Login failed");
            }

            if (data.role !== "STUDENT") {
                throw new Error("This login is only for students.");
            }

            localStorage.setItem("token", data.token);
            localStorage.setItem("role", data.role);
            localStorage.setItem("email", data.email);

            message.style.color = "green";
            message.textContent = "Login successful!";

            window.location.href = "departments.html";

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Login";
        }
    });
</script>

</body>
</html>
