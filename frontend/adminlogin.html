
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CMR Library Zone</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            min-height: 65px;
            flex-wrap: wrap;
            background: white;
        }

        #logo {
            width: 30%;
            min-width: 220px;
            text-align: center;
            line-height: 65px;
            font-size: 32px;
            background: white;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex: 1;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px;
        }

        nav a {
            text-decoration: none;
            color: black;
        }

        nav a:hover {
            color: #2c7ad6;
        }

        section {
            min-height: calc(100vh - 65px);
            width: 100%;
            background-image: url('image.png');
            background-size: cover;
            background-position: center;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logbox {
            min-height: 350px;
            width: min(400px, 100%);
            background: white;
            border-radius: 30px;
            padding: 30px 25px;
            text-align: center;
        }

        .logbox h1 {
            color: #2c7ad6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            margin-left: 5%;
            font-weight: bold;
            font-size: 14px;
        }

        .t {
            width: 90%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-btn {
            width: 120px;
            height: 38px;
            background: #fb8f4b;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .login-btn:hover {
            background: #f47729;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            #logo {
                width: 100%;
            }

            nav {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div id="logo">
        LIBRARY<b style="color:#2c7ad6;">ZONE</b>
    </div>

    <nav>
        <a href="index.html" class="fa fa-home"> Home</a>
        <a href="gallery.html" class="fa fa-image"> Gallery</a>
        <a href="adminlogin.html" class="fa fa-user"> Admin Login</a>
        <a href="librarianlogin.html" class="fa fa-book"> Librarian Login</a>
        <a href="studentlogin.html" class="fa fa-graduation-cap"> Student Login</a>
        <a href="about.html" class="fa fa-info-circle"> About</a>
    </nav>
</header>

<section>

    <div class="logbox">

        <h1>ADMIN LOGIN</h1>

        <form id="adminLoginForm">

            <label for="email">EMAIL</label>

            <input
                type="email"
                class="t"
                id="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="password">PASSWORD</label>

            <input
                type="password"
                class="t"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="login-btn"
                id="loginButton">
                Login
            </button>

        </form>

        <p id="message" role="status"></p>

    </div>

</section>

<script>

    const API_URL = "http://localhost:8080";

    const loginForm = document.getElementById("adminLoginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.style.color = "blue";
        message.textContent = "Checking credentials...";

        loginButton.disabled = true;

        try {

            const response = await fetch(API_URL + "/api/users/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });

            const responseText = await response.text();

            let data;

            try {
                data = JSON.parse(responseText);
            } catch {
                throw new Error("Unexpected response from server.");
            }

            if (!response.ok) {
                throw new Error(
                    data.message || "Invalid email or password."
                );
            }

            if (data.role !== "ADMIN") {
                throw new Error(
                    "Access denied. Only Admin accounts can login here."
                );
            }

            if (!data.token) {
                throw new Error("Login token was not received.");
            }

            // Store authentication details for API requests
            localStorage.setItem("token", data.token);
            localStorage.setItem("role", data.role);
            localStorage.setItem("email", email);

            message.style.color = "green";
            message.textContent = "Admin login successful! Redirecting...";

            window.location.href = "admin_panel.html";

        } catch (error) {

            message.style.color = "red";
            message.textContent = error.message;

        } finally {

            loginButton.disabled = false;

        }

    });

</script>

</body>
</html>
