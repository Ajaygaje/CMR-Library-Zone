
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMR Library Zone</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap"
rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Lora', serif;
    background: #f5f5f5;
}

/* Header */

header {
    background: #2c7ad6;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-wrap: wrap;
}

#logo {
    min-height: 65px;
    display: flex;
    align-items: center;
    font-size: 30px;
    font-weight: bold;
}

#logo span {
    color: #f5a623;
}

/* Navigation */

nav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 12px 15px;
    border-radius: 5px;
    transition: background 0.3s;
}

nav a:hover {
    background: #f5a623;
}

/* Home Section */

section {
    min-height: 90vh;
    width: 100%;
    background-image: url('libraryhomeimg.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 20px;
}

.quote {
    background: rgba(0, 0, 0, 0.6);
    padding: 30px;
    border-radius: 10px;
    max-width: 600px;
    animation: fadeIn 2s ease-in-out;
}

.quote p {
    font-size: 2em;
    margin: 0;
}

.quote p.author {
    font-size: 1.5em;
    margin-top: 10px;
    font-style: italic;
}

/* Footer */

footer {
    background: #2c7ad6;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 20px;
}

/* Animation */

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

/* Mobile Responsive */

@media(max-width: 750px) {

    header {
        flex-direction: column;
        padding: 10px;
    }

    #logo {
        font-size: 25px;
    }

    nav {
        justify-content: center;
        padding-bottom: 10px;
    }

    nav a {
        padding: 10px;
        font-size: 13px;
    }

    .quote p {
        font-size: 1.4em;
    }

    .quote p.author {
        font-size: 1.1em;
    }

    section {
        min-height: 70vh;
    }

}

</style>
</head>

<body>

<!-- Header -->

<header>

    <div id="logo">
        CMR LIBRARY<span>ZONE</span>
    </div>

    <nav>
        <a href="index.html" class="fa fa-home"> Home</a>
        <a href="gallery.html" class="fa fa-image"> Gallery</a>
        <a href="adminlogin.html" class="fa fa-user"> Admin Login</a>
        <a href="librarianlogin.html" class="fa fa-book"> Librarian Login</a>
        <a href="studentlogin.html" class="fa fa-graduation-cap"> Student Login</a>
        <a href="about.html" class="fa fa-info-circle"> About</a>
    </nav>

</header>

<!-- Home Section -->

<section>

    <div class="quote">

        <p>
            "A room without books is like a body without a soul."
        </p>

        <p class="author">
            - Marcus Tullius Cicero
        </p>

    </div>

</section>

<!-- Footer -->

<footer>

    &copy; 2026 CMR Library Zone. All Rights Reserved.

</footer>

</body>
</html>
